services:
  speech-adapter:
    build: .
    ports:
      - "${ADAPTER_BIND_ADDRESS:-0.0.0.0}:${ADAPTER_PORT:-8086}:3000"
    env_file:
      - .env.local
    environment:
      HTTP_PORT: 3000
      ADMIN_DB_PATH: /data/speech-adapter.sqlite
    volumes:
      - speech-adapter-data:/data
    restart: unless-stopped

volumes:
  speech-adapter-data:
